{% extends "base.html" %}

{% block title %}Register Customer Account — Dispatch &amp; Inventory{% endblock %}

{% block content %}
<div style="max-width:440px; margin:var(--space-8) auto;">
  <div class="panel">
    <div style="text-align:center; margin-bottom:var(--space-6);">
      <span class="badge" style="margin-bottom:var(--space-2);">NEW ACCOUNT</span>
      <h1 style="font-size:1.75rem; margin-top:var(--space-1); margin-bottom:var(--space-1);">Create Account</h1>
      <p style="color:var(--text-muted); font-size:0.875rem;">
        Register to manage cart stacks, place orders, and track dispatch milestones.
      </p>
    </div>

    <form method="POST" action="/register">
      <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token') }}">

      <div class="form-group" style="margin-bottom:var(--space-4);">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control"
               placeholder="Full Name" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4);">
        <label for="email">Account Email</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="name@example.com" required>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-6);">
        <label for="password">Password (Minimum 6 Characters)</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Create password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:var(--space-3); font-size:0.9375rem;">
        Complete Registration
      </button>
    </form>

    <div style="margin-top:var(--space-6); padding-top:var(--space-4); border-top:1px solid var(--border-light); font-size:0.875rem; text-align:center;">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
