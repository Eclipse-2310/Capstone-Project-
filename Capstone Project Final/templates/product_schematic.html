{% macro render_schematic(product_id, product_name) %}
<svg class="product-schematic-svg" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schematic drawing of {{ product_name }}">
  {% if product_id == 1 %}
    <!-- Laptop: Chassis, display, keyboard matrix, trackpad -->
    <rect x="25" y="15" width="70" height="42" rx="2" stroke="currentColor" stroke-width="1.4" />
    <rect x="29" y="19" width="62" height="34" stroke="currentColor" stroke-width="1" stroke-dasharray="1 0" />
    <polygon points="16,63 104,63 94,69 26,69" stroke="currentColor" stroke-width="1.4" />
    <rect x="52" y="64" width="16" height="4" rx="0.5" stroke="currentColor" stroke-width="1" />
    <line x1="40" y1="65" x2="48" y2="65" stroke="currentColor" stroke-width="1" />
    <line x1="72" y1="65" x2="80" y2="65" stroke="currentColor" stroke-width="1" />
  {% elif product_id == 2 %}
    <!-- Mouse: Ergonomic shell, scroll wheel, parting line -->
    <path d="M48 24 C48 14, 72 14, 72 24 L72 54 C72 66, 48 66, 48 54 Z" stroke="currentColor" stroke-width="1.4" />
    <rect x="57" y="22" width="6" height="12" rx="2" stroke="currentColor" stroke-width="1.2" />
    <line x1="60" y1="34" x2="60" y2="46" stroke="currentColor" stroke-width="1" />
    <path d="M48 36 C54 38, 66 38, 72 36" stroke="currentColor" stroke-width="1" />
  {% elif product_id == 3 %}
    <!-- Keyboard: Tenkeyless chassis, staggered key rails, spacebar -->
    <rect x="15" y="24" width="90" height="36" rx="2" stroke="currentColor" stroke-width="1.4" />
    <line x1="22" y1="32" x2="98" y2="32" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3" />
    <line x1="22" y1="40" x2="98" y2="40" stroke="currentColor" stroke-width="1" stroke-dasharray="6 3" />
    <line x1="22" y1="48" x2="98" y2="48" stroke="currentColor" stroke-width="1" stroke-dasharray="8 3" />
    <rect x="42" y="52" width="36" height="4" rx="1" stroke="currentColor" stroke-width="1.2" />
  {% elif product_id == 4 %}
    <!-- Monitor: Widescreen bezel, screen margin, pedestal stand -->
    <rect x="20" y="14" width="80" height="48" rx="2" stroke="currentColor" stroke-width="1.4" />
    <rect x="24" y="18" width="72" height="40" stroke="currentColor" stroke-width="1" />
    <rect x="56" y="62" width="8" height="8" stroke="currentColor" stroke-width="1.2" />
    <line x1="42" y1="70" x2="78" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  {% elif product_id == 5 %}
    <!-- Printer: Main casing, rear paper feeder, front output slot -->
    <rect x="22" y="32" width="76" height="34" rx="2" stroke="currentColor" stroke-width="1.4" />
    <polygon points="34,16 86,16 82,32 38,32" stroke="currentColor" stroke-width="1.2" />
    <line x1="42" y1="22" x2="78" y2="22" stroke="currentColor" stroke-width="1" />
    <line x1="46" y1="26" x2="74" y2="26" stroke="currentColor" stroke-width="1" />
    <rect x="36" y="46" width="48" height="10" rx="1" stroke="currentColor" stroke-width="1.2" />
    <circle cx="86" cy="40" r="2" stroke="currentColor" stroke-width="1.2" />
  {% elif product_id == 6 %}
    <!-- Webcam: Cylindrical lens barrel, dual aperture rings, mount clamp -->
    <circle cx="60" cy="34" r="18" stroke="currentColor" stroke-width="1.4" />
    <circle cx="60" cy="34" r="12" stroke="currentColor" stroke-width="1" />
    <circle cx="60" cy="34" r="5" stroke="currentColor" stroke-width="1.2" />
    <rect x="57" y="52" width="6" height="8" stroke="currentColor" stroke-width="1" />
    <path d="M42 66 C42 60, 78 60, 78 66" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  {% elif product_id == 7 %}
    <!-- Headphones: Structural headband arc, dual ear cushions -->
    <path d="M30 46 C30 18, 90 18, 90 46" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    <path d="M36 44 C36 24, 84 24, 84 44" stroke="currentColor" stroke-width="1" />
    <rect x="24" y="42" width="12" height="24" rx="4" stroke="currentColor" stroke-width="1.4" />
    <rect x="84" y="42" width="12" height="24" rx="4" stroke="currentColor" stroke-width="1.4" />
    <line x1="28" y1="46" x2="28" y2="62" stroke="currentColor" stroke-width="1" />
    <line x1="92" y1="46" x2="92" y2="62" stroke="currentColor" stroke-width="1" />
  {% elif product_id == 8 %}
    <!-- Speakers: Twin acoustic cabinets with dual driver cones -->
    <rect x="24" y="18" width="30" height="48" rx="2" stroke="currentColor" stroke-width="1.4" />
    <circle cx="39" cy="30" r="4.5" stroke="currentColor" stroke-width="1.2" />
    <circle cx="39" cy="49" r="8.5" stroke="currentColor" stroke-width="1.2" />
    <rect x="66" y="18" width="30" height="48" rx="2" stroke="currentColor" stroke-width="1.4" />
    <circle cx="81" cy="30" r="4.5" stroke="currentColor" stroke-width="1.2" />
    <circle cx="81" cy="49" r="8.5" stroke="currentColor" stroke-width="1.2" />
  {% elif product_id == 9 %}
    <!-- External Hard Drive: Enclosure chassis, bumper ridge, LED, port -->
    <rect x="34" y="16" width="52" height="52" rx="3" stroke="currentColor" stroke-width="1.4" />
    <rect x="39" y="21" width="42" height="42" rx="2" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="46" cy="28" r="2" stroke="currentColor" stroke-width="1.2" />
    <rect x="52" y="64" width="16" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2" />
  {% elif product_id == 10 %}
    <!-- USB Flash Drive: Thumb body, USB-A metal connector, lanyard hole -->
    <rect x="28" y="30" width="46" height="20" rx="2" stroke="currentColor" stroke-width="1.4" />
    <rect x="74" y="34" width="18" height="12" rx="1" stroke="currentColor" stroke-width="1.2" />
    <line x1="82" y1="38" x2="87" y2="38" stroke="currentColor" stroke-width="1" />
    <line x1="82" y1="42" x2="87" y2="42" stroke="currentColor" stroke-width="1" />
    <circle cx="36" cy="40" r="2.5" stroke="currentColor" stroke-width="1.2" />
  {% else %}
    <!-- Default hardware component box schematic -->
    <rect x="25" y="20" width="70" height="44" rx="2" stroke="currentColor" stroke-width="1.4" />
    <circle cx="60" cy="42" r="10" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 2" />
    <line x1="35" y1="42" x2="45" y2="42" stroke="currentColor" stroke-width="1.2" />
    <line x1="75" y1="42" x2="85" y2="42" stroke="currentColor" stroke-width="1.2" />
  {% endif %}
</svg>
{% endmacro %}
